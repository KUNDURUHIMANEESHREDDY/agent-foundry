name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The audit shells out to git and to subprocesses; the symlink guards in
        # the capability tests are skipped on Windows, so both are covered.
        #
        # `expect_skips` is the set of eval suites allowed to skip on that runner.
        # ubuntu-latest has a working container runtime, so nothing may skip
        # there. windows-latest has no usable one -- and `python:3.11-slim` is a
        # Linux image, so it cannot run against Windows containers either -- so
        # the containment suite is expected to skip. Naming it here is the point:
        # an *unexpected* skip still fails, and containment is proven on ubuntu,
        # so the build as a whole cannot pass without it.
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            expect_skips: ""
          - os: windows-latest
            expect_skips: "container-isolation"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Configure git identity
        # `git.commit` sets its own author, but the sandbox scripts and the
        # eval runner still touch the host config.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name  "ci"
          git config --global init.defaultBranch main

      - name: Unit tests
        run: pytest tests -q

      - name: Eval suites
        run: factory eval --suites evals --expect-skips "${{ matrix.expect_skips }}"

      - name: Containment cases actually ran
        # A suite whose external runtime is missing is skipped, not failed, so
        # the run stays green on a machine without Docker. That is right locally
        # and wrong here: these runners have a container runtime, so a skip means
        # the containment claims were never tested and the build says nothing.
        shell: bash
        env:
          EXPECTED_SKIPPED_SUITES: ${{ matrix.expect_skips }}
        run: |
          # The same declaration the eval step used. Without it this re-run
          # blocks on the very skip the matrix permits, which is what the first
          # version of this step did.
          factory eval --suites evals --expect-skips "$EXPECTED_SKIPPED_SUITES" --json > eval.json
          python - <<'PY'
          import json, os, sys

          # The envelope is {"suites": [...], "totals": {...}} -- not a bare
          # list. The first version of this gate iterated the top-level object
          # and died with "'str' object has no attribute 'get'", which meant the
          # gate never actually evaluated its own condition.
          report = json.load(open("eval.json", encoding="utf-8"))
          suites = report["suites"]

          skipped = {s["suite"] for s in suites if s.get("skipped")}
          expected = {
              name.strip()
              for name in os.environ.get("EXPECTED_SKIPPED_SUITES", "").split(",")
              if name.strip()
          }

          unexpected = skipped - expected
          if unexpected:
              sys.exit(f"unexpected skip(s): {sorted(unexpected)} -- these suites "
                       f"must run on this runner")

          # The other direction matters too: a suite listed as expected to skip
          # that actually ran means the runtime is present and the declaration
          # is stale, which would let the gate drift towards skipping nothing.
          unexpectedly_ran = expected - skipped
          if unexpectedly_ran:
              sys.exit(f"expected to skip but ran: {sorted(unexpectedly_ran)} -- "
                       f"the runtime is available, so drop it from expect_skips")

          if "container-isolation" not in {s["suite"] for s in suites}:
              sys.exit("the container-isolation suite did not appear at all")

          print(f"skipped suites: {sorted(skipped) or 'none'}")
          PY

  # The suite passing is not evidence that the suite works. This job breaks one
  # mitigation at a time and fails if the suite does not notice.
  sabotage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name  "ci"
          git config --global init.defaultBranch main

      - name: Verify the working tree is untouched
        # The audit must never patch the repository. If it ever does, fail loudly
        # rather than reporting a result produced by a dirty tree.
        #
        # The snapshots go to RUNNER_TEMP, not the working directory. Writing
        # them here made this step impossible to pass: the shell creates
        # `after.txt` by redirection before `git status` runs, so the second
        # snapshot lists its own scratch file and the diff is never empty.
        # `RUNNER_TEMP` is set on both ubuntu and windows runners.
        run: |
          before="${RUNNER_TEMP}/tree-before.txt"
          after="${RUNNER_TEMP}/tree-after.txt"
          git status --porcelain > "$before"
          factory sabotage --suites evals --jobs 4
          git status --porcelain > "$after"
          diff "$before" "$after" && echo "working tree unchanged"

      - name: No temp sandboxes left behind
        run: |
          left=$(find "${TMPDIR:-/tmp}" -maxdepth 1 -name 'factory-sabotage-*' | wc -l)
          if [ "$left" -ne 0 ]; then
            echo "::error::$left sabotage sandbox(es) leaked into the temp directory"
            exit 1
          fi

      - name: No orphan processes
        run: |
          sleep 5
          strays=$(pgrep -f 'while True' | wc -l)
          if [ "$strays" -ne 0 ]; then
            echo "::error::$strays orphaned python process(es) survived the audit"
            pgrep -af 'while True'
            exit 1
          fi