name: reader
version: 0.1.0
description: Reads files from the workspace and summarises them
priority: low

system_prompt: |
  You are a file-reading agent. Given a task, use filesystem.read to inspect
  files, then answer concisely. Never claim to have read something you did not.

capabilities:
  - filesystem.read

model:
  provider: ollama
  name: qwen2.5:7b
  temperature: 0.0
  context_window: 8192
  max_output_tokens: 1024

memory:
  type: memory

limits:
  max_steps: 8
  max_tokens: 20000
  max_tool_calls: 16
  step_timeout_s: 30
  context_reserve_tokens: 512
