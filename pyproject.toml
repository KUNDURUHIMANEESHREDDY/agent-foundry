[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-factory"
version = "0.1.0"
description = "Compile declarative agent specs into sandboxed executable agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Observability is optional: nothing in the core imports it.
observability = ["langfuse>=4.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "langfuse>=4.0"]

[project.scripts]
factory = "factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
